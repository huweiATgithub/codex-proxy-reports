name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.verify.outputs.version }}
      tag:
        value: ${{ jobs.verify.outputs.tag }}
      archive:
        value: ${{ jobs.verify.outputs.archive }}
      host-range:
        value: ${{ jobs.verify.outputs.host-range }}
      sdk-revision:
        value: ${{ jobs.verify.outputs.sdk-revision }}
      host-matrix:
        value: ${{ jobs.verify.outputs.host-matrix }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test and package (Linux x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      archive: ${{ steps.version.outputs.archive }}
      host-range: ${{ steps.version.outputs.host-range }}
      sdk-revision: ${{ steps.version.outputs.sdk-revision }}
      host-matrix: ${{ steps.version.outputs.host-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$(awk -F '"' '/^channel =/ { print $2 }' rust-toolchain.toml)" \
            --profile minimal --component clippy --component rustfmt
      - run: npm ci
      - name: Check versions, SDK pin and Host verification matrix
        id: version
        run: node scripts/host-compatibility.js >> "$GITHUB_OUTPUT"
      - name: Build private management resources
        run: npm run build
      - name: Rust formatting, lint and tests
        run: |
          cargo fmt --manifest-path backend/Cargo.toml -- --check
          cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path backend/Cargo.toml --locked
      - name: JavaScript and release tooling tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test
      - name: Check out the packaging CLI at the SDK revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zyycn/codex-proxy-rs
          ref: ${{ steps.version.outputs.sdk-revision }}
          path: _host-sdk
          persist-credentials: false
      - name: Build the matching packaging CLI
        run: cargo build --manifest-path _host-sdk/backend/Cargo.toml --locked --package codex-proxy-plugin-cli --bin cpr-plugin --target-dir _host-sdk/cli-target
      - name: Build and package the plugin
        env:
          CPR_PLUGIN: ${{ github.workspace }}/_host-sdk/cli-target/debug/cpr-plugin
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          cargo build --manifest-path backend/Cargo.toml --release --locked
          npm run plugin:package
          node scripts/verify-package.js "dist/packages/$ARCHIVE"
          maximum=$(readelf --version-info backend/target/release/codex-proxy-reports | \
            sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' | sort -V | tail -n 1)
          test -n "$maximum"
          test "$(printf '%s\n' "$maximum" '2.34' | sort -V | tail -n 1)" = '2.34'
          cd dist/packages
          sha256sum "$ARCHIVE" "$ARCHIVE.sha256" > SHA256SUMS
      - name: Upload the tested installable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64-package
          path: |
            dist/packages/${{ steps.version.outputs.archive }}
            dist/packages/${{ steps.version.outputs.archive }}.sha256
            dist/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Summarize the tested package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HOST_RANGE: ${{ steps.version.outputs.host-range }}
        run: |
          printf 'Built **%s**, Linux x86_64 GNU, Host range **%s**.\n\n' "$VERSION" "$HOST_RANGE" >> "$GITHUB_STEP_SUMMARY"
          printf 'Rust, JavaScript, browser and package integrity checks passed. Real-host verification uses the same archive in every matrix job.\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat dist/packages/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Host acceptance (${{ matrix.version }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.host-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64-package
          path: dist/packages
      - name: Test the shared package on the selected Host
        env:
          HOST_VERSION: ${{ matrix.version }}
          PLUGIN_ARCHIVE: dist/packages/${{ needs.verify.outputs.archive }}
        run: bash scripts/ci-integration.sh
      - name: Preserve Host acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-evidence-${{ matrix.version }}
          path: dist/verification/${{ matrix.version }}/
          if-no-files-found: error
          retention-days: 14
