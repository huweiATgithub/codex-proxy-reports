[package]
name = "codex-proxy-reports"
version = "0.1.2"
edition = "2024"
rust-version = "1.97"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "45954899e53081a2e775fb9351e22908e85221c7", features = ["io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"

[profile.release]
strip = true
lto = "thin"
